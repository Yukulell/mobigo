<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobigo - Horaires</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mobigo</h1>
    </header>
    
    <div class="filters-container">
        <div class="filter-grid">
            <div class="filter-full">
                <label>Ligne & Direction</label>
                <select id="ligne-select">
                    <option value="lr201_aller">LR201: Besançon > Vesoul (Express)</option>
                    <option value="lr201_retour">LR201: Vesoul > Besançon (Express)</option>
                    <option value="lr202_aller">LR202: Besançon > Vesoul</option>
                    <option value="lr202_retour">LR202: Vesoul > Besançon</option>
                </select>
            </div>
            <div class="filter-full">
                <label>Date du trajet</label>
                <input type="date" id="date-trajet">
            </div>
            <div>
                <label>Départ</label>
                <select id="depart-select"></select>
            </div>
            <div>
                <label>Arrivée</label>
                <select id="arrivee-select"></select>
            </div>
        </div>
    </div>

    <div class="results-container" id="results-container">
        <!-- Les cartes s'afficheront ici -->
    </div>

    <script src="script.js"></script>
</body>
</html>
