<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaires Mobigo</title>
    <link rel="stylesheet" href="style.css">

        <div class="logo-container">
            <h1>Mobigo</h1>
            <p>Bourgogne-Franche-Comté</p>
        </div>
    </header>
    
    <main>
        <h2>Sélectionnez votre ligne et direction</h2>
        <div class="lignes-grid">
            <!-- LR201 -->
            <a href="lr201_aller.html" class="card-ligne">

                    <h3>Besançon > Vesoul</h3>

            <a href="lr201_retour.html" class="card-ligne">

            <a href="lr202_aller.html" class="card-ligne">
                <div class="ligne-badge">LR202</div>

                    <p>Via Devecey, Voray, Perrouse...</p>
                </div>
            </a>
            <a href="lr202_retour.html" class="card-ligne">
                <div class="ligne-badge">LR202</div>
                <div class="ligne-info">
                    <h3>Vesoul > Besançon</h3>
